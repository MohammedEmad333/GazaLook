name: gazalook
description: "GazaLook — a fast, lightweight local fashion e-commerce app for Gaza."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (predictable, testable)
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # Local storage / caching (cart + user session)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Networking & low-bandwidth image handling
  dio: ^5.4.3+1
  cached_network_image: ^3.3.1

  # Functional error handling in the domain layer
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^7.7.0

  # Utils
  intl: ^0.20.2 # aligned with the version flutter_localizations pins
  carousel_slider: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  # NOTE: Hive TypeAdapter codegen (hive_generator/build_runner) is intentionally
  # omitted for now — hive_generator caps `analyzer <7.0.0`, which conflicts with
  # bloc_test. Add the maintained `hive_ce`/`hive_ce_generator` fork when
  # generated adapters are first needed (later phases).

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Montserrat (display/headline) + Inter (body) mirror the design mockups.
  # Place the .ttf files under assets/fonts/ to enable these families.
  # fonts:
  #   - family: Montserrat
  #     fonts:
  #       - asset: assets/fonts/Montserrat-Regular.ttf
  #       - asset: assets/fonts/Montserrat-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Montserrat-Bold.ttf
  #         weight: 700
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
